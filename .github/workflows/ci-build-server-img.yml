name: Build and publish DMR-server with

on:
  push:
    branches:
      - dev
    paths:
      - 'env.server'

jobs:
  PackageDeploy:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v2

      - name: Docker Setup BuildX
        uses: docker/setup-buildx-action@v2

      - name: Docker Build
        run: |

          docker image build -f apps/dmr-server/Dockerfile -t server-1.2.4 --no-cache .

      - name: Log in to GitHub container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
      # Push Docker image
      - name: Push Docker image to ghcr
        run: docker push ghcr.io/varmoh/dmr:server-1.2.4
